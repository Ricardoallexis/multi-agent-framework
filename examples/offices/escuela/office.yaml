schema: maf.office/1
id: escuela
name: Escuela de ejemplo
description: Oficina de ejemplo con datos ficticios para planeación de clases, seguimiento solo local y avisos en modo de prueba (sin gasto).
local_only: false
orchestrator:
  enabled: true
  name: Coordinación
  default_plan:
    - area: planeacion
      workflow: plan_clase
    - area: avisos
      workflow: escribir_aviso
      after: [planeacion]
areas:
  - id: planeacion
    name: Planeación
    path: areas/planeacion
    sensitivity: normal
    local_only: false
    requires: [model.text]
  - id: seguimiento
    name: Seguimiento
    path: areas/seguimiento
    sensitivity: sensitive
    local_only: true
    requires: [model.text, model.local]
  - id: avisos
    name: Avisos y respuestas
    path: areas/avisos
    sensitivity: normal
    local_only: false
    requires: [model.text]
relations:
  - from: planeacion
    to: avisos
    kind: hands_off
  - from: seguimiento
    to: planeacion
    kind: consults
