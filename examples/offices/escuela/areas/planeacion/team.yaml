schema_version: 1
id: escuela_planeacion_team
description: Equipo de ejemplo encargado de preparar y revisar los planes de clase.

roles:
  - id: redaccion
    purpose: Redacta el plan de clase a partir del tema indicado.
    rules:
      - Proponer actividades claras y adaptadas al tema recibido.
    skills: []
    contracts:
      - PlanClase
    capabilities:
      - model.text
    permissions: []

  - id: revision
    purpose: Revisa el plan de clase antes de aprobarlo.
    rules:
      - Confirmar que el objetivo y las actividades coincidan con el grupo.
    skills: []
    contracts:
      - PlanClase
    capabilities:
      - doc.review
    permissions: []

members:
  - id: agente_planeacion
    kind: agent
    agent: docente_planeacion

  - id: responsable
    kind: person
    name: Responsable

assignments:
  - role: redaccion
    member: agente_planeacion
  - role: revision
    member: responsable

relationships:
  - type: reviews
    from: revision
    to: redaccion
