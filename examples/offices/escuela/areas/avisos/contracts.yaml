schema: maf.contracts/1
contracts:
  Aviso:
    description: Aviso corto listo para revisar antes de publicar.
    fields:
      titulo:
        type: string
        max_length: 120
      cuerpo:
        type: string
        document: true
  Respuesta:
    description: Borrador de respuesta a un mensaje recibido para revisar antes de enviar.
    fields:
      respuesta:
        type: string
        document: true
samples:
  Aviso:
    titulo: Aviso de horario especial de esta semana
    cuerpo: |
      Informamos que este viernes el horario de atención será de 9:00 a 14:00.
      Muchas gracias por su comprensión.
  Respuesta:
    respuesta: |
      Muchas gracias por escribirnos. Recibimos tu mensaje y confirmamos el horario de atención habitual de lunes a viernes.
      Si necesitas algún dato adicional, quedamos a tu disposición.
