schema_version: 1
id: avisos_team
description: Equipo de ejemplo encargado de redactar y revisar avisos y respuestas a mensajes.

roles:
  - id: redaccion
    purpose: Redacta avisos y borradores de respuesta claros y respetuosos.
    rules:
      - Ajustarse únicamente a los datos incluidos en el tema o en el mensaje recibido.
    skills: []
    contracts:
      - Aviso
      - Respuesta
    capabilities:
      - model.text
    permissions: []

  - id: revision
    purpose: Revisa cada aviso o respuesta antes de publicarlo o enviarlo.
    rules:
      - Comprobar que las fechas, horarios y el tono sean los adecuados.
    skills: []
    contracts:
      - Aviso
      - Respuesta
    capabilities:
      - doc.review
    permissions: []

members:
  - id: agente_avisos
    kind: agent
    agent: redactor_avisos

  - id: responsable
    kind: person
    name: Responsable

assignments:
  - role: redaccion
    member: agente_avisos
  - role: revision
    member: responsable

relationships:
  - type: reviews
    from: revision
    to: redaccion
