id: menu_semana
description: Prepara el menú semanal a partir de un pedido y lo deja pendiente de revisión.
max_iterations: 1
inputs:
  - name: pedido
    label: Pedido del menú
    description: Indica los días, platos, ingredientes o restricciones para armar el menú.
    example: Menú de lunes a viernes con plato caliente, opción vegetal y fruta.
    required: true
    type: long_text
steps:
  - id: redactar_menu
    description: Redacta la propuesta de menú semanal para revisión de la persona responsable.
    agent: redactor_menu
    prompt_id: menu/menu_semana
    prompt_version: 1
    skills: []
    contract: MenuSemana
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: true
