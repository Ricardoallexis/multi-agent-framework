schema_version: 1
id: cafeteria_compras_team
description: Equipo de ejemplo encargado de preparar y revisar la lista de compras.

roles:
  - id: redaccion
    purpose: Arma la lista de pedido a partir del inventario actual.
    rules:
      - Incluir solo los productos faltantes o con pocas existencias según el inventario.
    skills: []
    contracts:
      - ListaPedido
    capabilities:
      - model.structured
    permissions: []

  - id: revision
    purpose: Revisa la lista de compras antes de aprobar el pedido.
    rules:
      - Verificar productos, cantidades y notas del resumen.
    skills: []
    contracts:
      - ListaPedido
    capabilities:
      - doc.review
    permissions: []

members:
  - id: agente_compras
    kind: agent
    agent: encargado_compras

  - id: responsable
    kind: person
    name: Responsable

assignments:
  - role: redaccion
    member: agente_compras
  - role: revision
    member: responsable

relationships:
  - type: reviews
    from: revision
    to: redaccion
