schema: maf.contracts/1
contracts:
  ListaPedido:
    description: Lista estructurada de productos y cantidades para revisar antes de comprar.
    fields:
      productos:
        type: list
        min_items: 1
        items:
          type: object
          fields:
            producto:
              type: string
            cantidad:
              type: string
      resumen:
        type: string
        document: true
samples:
  ListaPedido:
    productos:
      - producto: Café en grano
        cantidad: 3 kg
      - producto: Leche entera
        cantidad: 12 litros
      - producto: Pan integral
        cantidad: 6 barras
    resumen: |
      Pedido semanal sugerido: 3 kg de café en grano, 12 litros de leche entera y 6 barras de pan integral.
