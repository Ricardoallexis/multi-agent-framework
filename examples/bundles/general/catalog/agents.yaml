agents:
  document_analyst:
    role: Reads a document and extracts the key points and the requested checks
    active: true
    capabilities:
      reading_comprehension: PRIMARY
      extraction: PRIMARY
  summary_writer:
    role: Writes clear summaries for a specific audience
    active: true
    capabilities:
      summarization: PRIMARY
      plain_language: STRONG
  research_analyst:
    role: Gathers and organizes findings from the given question and context
    active: true
    capabilities:
      research: PRIMARY
      synthesis: STRONG
  decision_advisor:
    role: Compares options against explicit criteria and proposes a recommendation
    active: true
    capabilities:
      option_comparison: PRIMARY
      recommendation: PRIMARY
  quality_reviewer:
    role: Reviews documents against criteria and gives a reasoned verdict
    active: true
    capabilities:
      review: PRIMARY
      verdict: STRONG
