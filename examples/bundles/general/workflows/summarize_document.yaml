# Bundle "general" (neutral domain example): summarizes a document for a specific audience.
# The inputs are declared with the `inputs:` schema; each name matches a {placeholder} in the prompts.
id: summarize_document
description: Summarizes a document in plain language for a specific audience; useful for meeting minutes, reports, long emails or articles.
max_iterations: 2
inputs:
  - name: document_text
    label: Document
    description: Full text of the document to summarize. Paste it as it is; there is no need to clean it up.
    example: "From March, the weekly team meeting will be on Wednesdays at 10:00 instead of Mondays. The minutes will be uploaded to the shared folder before 18:00 the same day."
    required: true
    type: long_text
  - name: focus
    label: Focus
    description: What you want to find in the document. If you leave it empty, the main ideas are extracted.
    example: Decisions made and deadlines
    required: false
    type: text
  - name: audience
    label: Audience
    description: Who will read the summary. It sets the tone and the level of detail. If you leave it empty, it is written for a general reader.
    example: Management team, no technical background
    required: false
    type: text
  - name: summary_length
    label: Length
    description: How long the summary should be. If you leave it empty, `medium` is used.
    example: medium
    required: false
    type: choice
    choices: [short, medium, detailed]
steps:
  - id: extract_key_points
    description: Reads the document and extracts the key points with the sentence that supports each one.
    agent: document_analyst
    prompt_id: general/extract_key_points
    prompt_version: 1
    skills: []
    contract: KeyPoints
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false

  - id: write_summary
    description: Writes the summary for the stated audience; you review it before accepting it.
    agent: summary_writer
    prompt_id: general/write_summary
    prompt_version: 1
    skills: []
    contract: DocumentSummary
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: true
