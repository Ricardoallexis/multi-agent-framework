# Bundle "general" (ejemplo neutral de dominio): resume un documento para un público concreto.
# Las entradas se declaran con el esquema de `inputs:`; cada nombre coincide con un {marcador} de los prompts.
id: summarize_document
description: Resume un documento en lenguaje claro para un público concreto; sirve para actas, informes, correos largos o artículos.
max_iterations: 2
inputs:
  - name: document_text
    label: Documento
    description: Texto completo del documento que se va a resumir. Pégalo tal cual; no hace falta limpiarlo.
    example: "A partir de marzo, la reunión semanal del equipo será los miércoles a las 10:00 en lugar de los lunes. Las actas se subirán a la carpeta compartida antes de las 18:00 del mismo día."
    required: true
    type: long_text
  - name: focus
    label: Enfoque
    description: Qué te interesa encontrar en el documento. Si lo dejas vacío, se extraen las ideas principales.
    example: Decisiones tomadas y plazos
    required: false
    type: text
  - name: audience
    label: Público
    description: Quién leerá el resumen. Define el tono y el nivel de detalle. Si lo dejas vacío, se escribe para un lector general.
    example: Equipo directivo, sin conocimientos técnicos
    required: false
    type: text
  - name: summary_length
    label: Longitud
    description: Cuánto debe ocupar el resumen. Si lo dejas vacío, se usa «media».
    example: media
    required: false
    type: choice
    choices: [breve, media, detallada]
steps:
  - id: extract_key_points
    description: Lee el documento y extrae los puntos clave con la frase que los respalda.
    agent: document_analyst
    prompt_id: general/extract_key_points
    prompt_version: 1
    skills: []
    contract: KeyPoints
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false

  - id: write_summary
    description: Redacta el resumen para el público indicado; tú lo revisas antes de darlo por bueno.
    agent: summary_writer
    prompt_id: general/write_summary
    prompt_version: 1
    skills: []
    contract: DocumentSummary
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: true
