# Bundle "general" (neutral domain example): reviews a document against a checklist.
id: review_checklist
description: Reviews a specification or another document against a list of criteria and gives a verdict with the problems and suggestions.
max_iterations: 2
inputs:
  - name: document_text
    label: Document to review
    description: Text of the specification, plan or document to review.
    example: "3.2 The system will notify the customer when the order leaves the warehouse. 3.4 Notifications should arrive quickly. Expected delivery: November 15."
    required: true
    type: long_text
  - name: checklist
    label: Checklist
    description: One criterion per line. If you leave it empty, the review covers clarity, completeness, consistency and whether each point can be verified.
    example: "Every requirement has an owner\nDeadlines are specific\nRisks are described"
    required: false
    type: long_text
  - name: document_kind
    label: Kind of document
    description: What kind of document it is. It helps to choose what to look at more closely. If you leave it empty, it is treated as a generic document.
    example: Requirements specification for an ordering application
    required: false
    type: text
steps:
  - id: check_items
    description: Checks the document criterion by criterion and notes whether it is met, partly met or not met.
    agent: document_analyst
    prompt_id: general/check_items
    prompt_version: 1
    skills: []
    contract: ChecklistResult
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false

  - id: summarize_review
    description: Sums up the review in a verdict with the blocking problems and the suggested improvements; you review it.
    agent: quality_reviewer
    prompt_id: general/summarize_review
    prompt_version: 1
    skills: []
    contract: ReviewReport
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: true
