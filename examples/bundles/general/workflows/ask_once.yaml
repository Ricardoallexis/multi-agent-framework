# One free-text task, one model call.
id: ask_once
description: Answers a simple task in a single session with the chosen model.
max_iterations: 1
inputs:
  - name: task
    label: Task
    description: Describe what you want to ask the model.
    example: Explain this idea in simple words.
    required: true
    type: long_text
steps:
  - id: answer
    description: Answers the given task.
    agent: summary_writer
    prompt_id: general/ask_once
    prompt_version: 1
    skills: []
    contract: FreeTextAnswer
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false
