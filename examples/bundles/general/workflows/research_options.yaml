# Bundle "general" (neutral domain example): gathers findings, compares options and recommends one.
# It does not browse the web: it works from the question and the context you give, and says what it does not know.
id: research_options
description: Researches a question with the context you give, compares the possible options and proposes a reasoned recommendation.
max_iterations: 2
inputs:
  - name: question
    label: Question or decision
    description: What you want to settle, written as a question or as a decision to make.
    example: Should a team of eight move from live weekly meetings to written summaries?
    required: true
    type: long_text
  - name: background
    label: Context
    description: Facts, background or documents you already have that help to answer. If you leave it empty, only the question is used.
    example: The team works in two time zones, three hours apart, and today spends about six hours a week in meetings.
    required: false
    type: long_text
  - name: constraints
    label: Constraints
    description: Limits the recommendation must respect, such as budget, deadlines or mandatory conditions.
    example: No extra spending and a trial of four weeks at most
    required: false
    type: text
steps:
  - id: gather_findings
    description: Gathers the relevant findings, says how much confidence they deserve and points out what is still unknown.
    agent: research_analyst
    prompt_id: general/gather_findings
    prompt_version: 1
    skills: []
    contract: ResearchFindings
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false

  - id: compare_options
    description: Defines criteria and compares at least two options with their advantages and drawbacks.
    agent: decision_advisor
    prompt_id: general/compare_options
    prompt_version: 1
    skills: []
    contract: OptionsComparison
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: false

  - id: recommend
    description: Recommends one option, explains why, points out the risks and proposes the next steps; you review it.
    agent: decision_advisor
    prompt_id: general/recommend
    prompt_version: 1
    skills: []
    contract: Recommendation
    preferred_model: local_default
    fallback_model: null
    requires_web: false
    when: null
    checkpoint_after: true
