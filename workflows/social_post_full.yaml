id: social_post_full
description: >-
  Prepara una publicación completa para una red social: investiga datos y fuentes (si la ejecución
  pide búsqueda web), define la estrategia, redacta el texto y deja listo el brief visual para quien
  genere la imagen. Úsalo cuando necesites el paquete entero; al terminar espera tu revisión.
max_iterations: 2
inputs:
  - name: topic
    label: Tema
    description: De qué trata la publicación y por qué le importa a quien la lea.
    example: Lanzamiento de nuestro soporte técnico 24/7
    type: text
  - name: objective
    label: Objetivo
    description: Qué debe lograr la publicación (dar a conocer algo, generar consultas, captar suscriptores). Orienta la investigación y la estrategia.
    example: Que los clientes sepan que ya pueden pedir ayuda a cualquier hora
    type: text
  - name: platform
    label: Plataforma
    description: Red social donde se publicará. De ella dependen la longitud, el formato, el tono y el formato de la imagen.
    example: LinkedIn
    type: text
  - name: audience
    label: Audiencia
    description: Quién va a leer la publicación y qué le interesa o le preocupa.
    example: Dueños de pequeñas empresas sin equipo de informática
    type: text
  - name: instructions
    label: Instrucciones
    description: >-
      Indicaciones para todos los pasos: tono, longitud, palabras que usar o evitar, número de hashtags.
      Si no tienes ninguna, escribe «Ninguna».
    example: Tono cercano y profesional, máximo 120 palabras, sin emojis, exactamente 3 hashtags
    type: long_text
  - name: research_context
    label: Investigación previa
    description: Datos y fuentes verificados sobre el tema, con sus enlaces. Son la única base de hechos del contenido. Déjalo vacío si no tienes ninguno.
    example: "Según el informe interno de 2026, 7 de cada 10 consultas llegan fuera de horario. Fuente: https://ejemplo.com/informe"
    type: long_text
    required: false
  - name: strategy_context
    label: Estrategia ya decidida
    description: Plan que ya tengas para la publicación (ángulo, mensaje central, cierre). Déjalo vacío si quieres que lo proponga el paso de estrategia.
    example: "Ángulo: ahorro de tiempo. Mensaje: siempre hay alguien disponible. Cierre: invitar a escribir por mensaje directo."
    type: long_text
    required: false
  - name: brand_context
    label: Marca
    description: Cómo habla la marca (tono, vocabulario, lo que nunca debe decir). Marca el estilo, no los hechos. Déjalo vacío si no hay guía de marca.
    example: Tono cercano y claro, tuteo, sin tecnicismos ni promesas exageradas
    type: long_text
    required: false
  - name: content_context
    label: Texto ya redactado
    description: Publicación aprobada que el diseño debe ilustrar (título, texto y hashtags). Déjalo vacío si aún no existe.
    example: "Título: Ayuda cuando la necesitas. Texto: Ahora respondemos a cualquier hora, todos los días. #Soporte #Pymes #Atención"
    type: long_text
    required: false
  - name: brand_visual_context
    label: Identidad visual
    description: Colores, tipografías y reglas visuales de la marca que el diseño puede usar. Si no hay ninguna, no se inventa ninguna.
    example: Azul oscuro y blanco, tipografía sin serifa, logotipo solo en la esquina inferior derecha
    type: long_text
    required: false
steps:
  - id: research
    description: Busca datos y fuentes sobre el tema en la web. Solo se ejecuta si la ejecución pide búsqueda web.
    agent: researcher
    prompt_id: researcher/research
    prompt_version: 2
    skills: []
    contract: ResearchOutput
    preferred_model: gemini_grounded
    fallback_model: null
    requires_web: true
    when: requires_web
    checkpoint_after: false

  - id: strategy
    description: Define el ángulo, el mensaje central y la estructura de la publicación, sin escribir el texto final.
    agent: strategist
    prompt_id: strategist/social_strategy
    prompt_version: 1
    skills:
      - social_media
    contract: StrategyOutput
    preferred_model: local_reasoning
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: false

  - id: create
    description: Redacta la publicación (título, gancho, texto, llamada a la acción y hashtags).
    agent: creator
    prompt_id: creator/social_post
    prompt_version: 2
    skills:
      - social_media
    contract: ContentOutput
    preferred_model: local_default
    fallback_model: cloud_fast
    requires_web: false
    when: null
    checkpoint_after: false

  - id: design
    description: Prepara el brief visual y el prompt técnico para generar la imagen fuera del framework, y espera tu revisión.
    agent: designer
    prompt_id: designer/visual_brief
    prompt_version: 1
    skills:
      - production/visual
    contract: VisualBriefOutput
    preferred_model: local_default
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: true
