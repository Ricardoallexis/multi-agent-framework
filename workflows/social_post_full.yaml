id: social_post_full
max_iterations: 2
steps:
  - id: research
    agent: researcher
    prompt_id: researcher/research
    prompt_version: 2
    skills: []
    contract: ResearchOutput
    preferred_model: gemini_grounded
    fallback_model: null
    requires_web: true
    when: requires_web
    checkpoint_after: false

  - id: strategy
    agent: strategist
    prompt_id: strategist/social_strategy
    prompt_version: 1
    skills:
      - social_media
    contract: StrategyOutput
    preferred_model: local_reasoning
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: false

  - id: create
    agent: creator
    prompt_id: creator/social_post
    prompt_version: 2
    skills:
      - social_media
    contract: ContentOutput
    preferred_model: local_default
    fallback_model: cloud_fast
    requires_web: false
    when: null
    checkpoint_after: false

  - id: design
    agent: designer
    prompt_id: designer/visual_brief
    prompt_version: 1
    skills:
      - production/visual
    contract: VisualBriefOutput
    preferred_model: local_default
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: true
