id: social_post_full
description: >-
  Prepares a complete social media post: researches data and sources (if the run asks for web
  search), defines the strategy, writes the text and leaves the visual brief ready for whoever
  generates the image. Use it when you need the whole package; when it finishes it waits for your
  review.
max_iterations: 2
inputs:
  - name: topic
    label: Topic
    description: What the post is about and why it matters to whoever reads it.
    example: Launch of our 24/7 technical support
    type: text
  - name: objective
    label: Objective
    description: What the post must achieve (raise awareness, generate inquiries, gain subscribers). It guides the research and the strategy.
    example: Let customers know they can now ask for help at any hour
    type: text
  - name: platform
    label: Platform
    description: Social network where it will be posted. The length, format, tone and image format depend on it.
    example: LinkedIn
    type: text
  - name: audience
    label: Audience
    description: Who will read the post and what they care about or worry about.
    example: Owners of small businesses with no IT team
    type: text
  - name: instructions
    label: Instructions
    description: >-
      Guidance for all the steps: tone, length, words to use or avoid, number of hashtags.
      If you have none, write "None".
    example: Friendly and professional tone, 120 words at most, no emojis, exactly 3 hashtags
    type: long_text
  - name: research_context
    label: Prior research
    description: Verified data and sources about the topic, with their links. They are the only factual basis of the content. Leave it empty if you have none.
    example: "According to the internal 2026 report, 7 out of 10 queries arrive outside office hours. Source: https://example.com/report"
    type: long_text
    required: false
  - name: strategy_context
    label: Strategy already decided
    description: A plan you already have for the post (angle, central message, closing). Leave it empty if you want the strategy step to propose one.
    example: "Angle: saving time. Message: someone is always available. Closing: invite people to send a direct message."
    type: long_text
    required: false
  - name: brand_context
    label: Brand
    description: How the brand speaks (tone, vocabulary, what it must never say). It sets the style, not the facts. Leave it empty if there is no brand guide.
    example: Friendly and clear tone, informal address, no jargon and no exaggerated promises
    type: long_text
    required: false
  - name: content_context
    label: Text already written
    description: Approved post that the design must illustrate (title, text and hashtags). Leave it empty if it does not exist yet.
    example: "Title: Help when you need it. Text: We now answer at any hour, every day. #Support #SmallBusiness #Care"
    type: long_text
    required: false
  - name: brand_visual_context
    label: Visual identity
    description: Colors, typefaces and visual rules of the brand that the design can use. If there are none, none is invented.
    example: Dark blue and white, sans-serif typeface, logo only in the bottom right corner
    type: long_text
    required: false
steps:
  - id: research
    description: Searches the web for data and sources about the topic. It only runs if the run asks for web search.
    agent: researcher
    prompt_id: researcher/research
    prompt_version: 2
    skills: []
    contract: ResearchOutput
    preferred_model: gemini_grounded
    fallback_model: null
    requires_web: true
    when: requires_web
    checkpoint_after: false

  - id: strategy
    description: Defines the angle, the central message and the structure of the post, without writing the final text.
    agent: strategist
    prompt_id: strategist/social_strategy
    prompt_version: 1
    skills:
      - social_media
    contract: StrategyOutput
    preferred_model: local_reasoning
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: false

  - id: create
    description: Writes the post (title, hook, text, call to action and hashtags).
    agent: creator
    prompt_id: creator/social_post
    prompt_version: 2
    skills:
      - social_media
    contract: ContentOutput
    preferred_model: local_default
    fallback_model: cloud_fast
    requires_web: false
    when: null
    checkpoint_after: false

  - id: design
    description: Prepares the visual brief and the technical prompt to generate the image outside the framework, and waits for your review.
    agent: designer
    prompt_id: designer/visual_brief
    prompt_version: 1
    skills:
      - production/visual
    contract: VisualBriefOutput
    preferred_model: local_default
    fallback_model: cloud_advanced
    requires_web: false
    when: null
    checkpoint_after: true
