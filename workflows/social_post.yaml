id: social_post
description: >-
  Writes a social media post from a topic, an audience and some instructions. If the run
  asks for web search, it first researches data and sources. Use it for a quick post; when it
  finishes it waits for your review.
max_iterations: 2
inputs:
  - name: topic
    label: Topic
    description: What the post is about and why it matters to whoever reads it.
    example: Launch of our 24/7 technical support
    type: text
  - name: platform
    label: Platform
    description: Social network where it will be posted. The length, format and tone depend on it.
    example: LinkedIn
    type: text
  - name: audience
    label: Audience
    description: Who will read the post and what they care about or worry about.
    example: Owners of small businesses with no IT team
    type: text
  - name: instructions
    label: Instructions
    description: >-
      Guidance for the writer: tone, length, words to use or avoid, number of hashtags.
      If you have none, write "None".
    example: Friendly and professional tone, 120 words at most, no emojis, exactly 3 hashtags
    type: long_text
  - name: objective
    label: Objective
    description: What the post must achieve (raise awareness, generate inquiries, gain subscribers). It guides which data the research looks for.
    example: Let customers know they can now ask for help at any hour
    type: text
  - name: research_context
    label: Prior research
    description: Verified data and sources about the topic, with their links. They are the only factual basis of the post. Leave it empty if you have none.
    example: "According to the internal 2026 report, 7 out of 10 queries arrive outside office hours. Source: https://example.com/report"
    type: long_text
    required: false
  - name: strategy_context
    label: Strategy
    description: A plan already decided for the post (angle, central message, closing). Leave it empty if you have none.
    example: "Angle: saving time. Message: someone is always available. Closing: invite people to send a direct message."
    type: long_text
    required: false
  - name: brand_context
    label: Brand
    description: How the brand speaks (tone, vocabulary, what it must never say). It sets the style, not the facts. Leave it empty if there is no brand guide.
    example: Friendly and clear tone, informal address, no jargon and no exaggerated promises
    type: long_text
    required: false
steps:
  - id: research
    description: Searches the web for data and sources about the topic. It only runs if the run asks for web search.
    agent: researcher
    prompt_id: researcher/research
    prompt_version: 2
    skills: []
    contract: ResearchOutput
    preferred_model: gemini_grounded
    fallback_model: null
    requires_web: true
    when: requires_web
    checkpoint_after: false

  - id: create
    description: Writes the post (title, hook, text, call to action and hashtags) and waits for your review.
    agent: creator
    prompt_id: creator/social_post
    prompt_version: 2
    skills:
      - social_media
    contract: ContentOutput
    preferred_model: local_default
    fallback_model: cloud_fast
    requires_web: false
    when: null
    checkpoint_after: true
