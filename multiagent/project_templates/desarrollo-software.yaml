schema: maf.project-template/1
id: desarrollo-software
title: Software development
description: A software change or product from design to launch. No dates; they are added when the project is created.
stages:
  - code: DIS
    title: Design
    phases: [Requirements, Architecture]
    tasks:
      - {id: T01, title: Scope and acceptance criteria, phase: Requirements, done_when: "Criteria approved by the person in charge"}
      - {id: T02, title: Solution design, phase: Architecture, depends_on: [T01]}
      - {id: T03, title: Data model and interface contract, phase: Architecture, depends_on: [T02]}
  - code: DES
    title: Development
    phases: [Service, Interface]
    tasks:
      - {id: T01, title: Build the service, phase: Service, assignee: "agent:claude", depends_on: ["stage:DIS"]}
      - {id: T02, title: Build the interface, phase: Interface, depends_on: ["DIS-T03"]}
      - {id: T03, title: Integrate service and interface, depends_on: [T01, T02], done_when: "The application works end to end in a test environment"}
  - code: PRU
    title: Testing
    phases: [Automated, Acceptance]
    tasks:
      - {id: T01, title: Unit and integration tests, phase: Automated, depends_on: ["stage:DES"]}
      - {id: T02, title: Acceptance tests, phase: Acceptance, depends_on: [T01]}
  - code: REV
    title: Review
    tasks:
      - {id: T01, title: Code review, depends_on: ["DES-T03"], requires: submitted}
      - {id: T02, title: Security review, depends_on: [T01], done_when: "No open findings of high severity"}
  - code: LAN
    title: Launch
    phases: [Preparation, Deployment]
    tasks:
      - {id: T01, title: Launch checklist, phase: Preparation, depends_on: ["stage:PRU", "stage:REV"]}
      - {id: T02, title: Deployment to production, phase: Deployment, depends_on: [T01], done_when: "Version deployed and verified"}
      - {id: T03, title: User documentation, phase: Preparation, depends_on: [T01]}
