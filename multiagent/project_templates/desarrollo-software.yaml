schema: maf.project-template/1
id: desarrollo-software
title: Desarrollo de software
description: Un cambio o producto de software desde el diseño hasta el lanzamiento. Sin fechas; se añaden al crear el proyecto.
stages:
  - code: DIS
    title: Diseño
    phases: [Requisitos, Arquitectura]
    tasks:
      - {id: T01, title: Alcance y criterios de aceptación, phase: Requisitos, done_when: "Criterios aprobados por la persona responsable"}
      - {id: T02, title: Diseño de la solución, phase: Arquitectura, depends_on: [T01]}
      - {id: T03, title: Modelo de datos y contrato de la interfaz, phase: Arquitectura, depends_on: [T02]}
  - code: DES
    title: Desarrollo
    phases: [Servicio, Interfaz]
    tasks:
      - {id: T01, title: Implementar el servicio, phase: Servicio, assignee: "agent:claude", depends_on: ["stage:DIS"]}
      - {id: T02, title: Implementar la interfaz, phase: Interfaz, depends_on: ["DIS-T03"]}
      - {id: T03, title: Integrar servicio e interfaz, depends_on: [T01, T02], done_when: "La aplicación funciona de punta a punta en un entorno de pruebas"}
  - code: PRU
    title: Pruebas
    phases: [Automatizadas, Aceptación]
    tasks:
      - {id: T01, title: Pruebas unitarias y de integración, phase: Automatizadas, depends_on: ["stage:DES"]}
      - {id: T02, title: Pruebas de aceptación, phase: Aceptación, depends_on: [T01]}
  - code: REV
    title: Revisión
    tasks:
      - {id: T01, title: Revisión de código, depends_on: ["DES-T03"], requires: submitted}
      - {id: T02, title: Revisión de seguridad, depends_on: [T01], done_when: "Sin hallazgos abiertos de gravedad alta"}
  - code: LAN
    title: Lanzamiento
    phases: [Preparación, Despliegue]
    tasks:
      - {id: T01, title: Lista de verificación del lanzamiento, phase: Preparación, depends_on: ["stage:PRU", "stage:REV"]}
      - {id: T02, title: Despliegue en producción, phase: Despliegue, depends_on: [T01], done_when: "Versión desplegada y verificada"}
      - {id: T03, title: Documentación para usuarios, phase: Preparación, depends_on: [T01]}
