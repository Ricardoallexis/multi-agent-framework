schema: maf.project-template/1
id: campana-marketing
title: Marketing campaign
description: A campaign from start to finish, from research to measurement. No dates; they are added when the project is created.
stages:
  - code: INV
    title: Research
    phases: [Sources, Analysis]
    tasks:
      - {id: T01, title: Audience study, phase: Sources, assignee: "agent:claude", done_when: "Report with 3 segments"}
      - {id: T02, title: Competitor analysis, phase: Analysis, depends_on: [T01]}
      - {id: T03, title: Summary of findings, phase: Analysis, depends_on: [T01, T02], done_when: "One-page document approved"}
  - code: EST
    title: Strategy
    phases: [Positioning, Plan]
    tasks:
      - {id: T01, title: Value proposition, phase: Positioning, depends_on: ["stage:INV"]}
      - {id: T02, title: Key messages, phase: Positioning, depends_on: [T01]}
      - {id: T03, title: Media plan and calendar, phase: Plan, depends_on: [T02]}
  - code: CON
    title: Content
    phases: [Copy, Pieces]
    tasks:
      - {id: T01, title: Main copy, phase: Copy, depends_on: ["stage:EST"]}
      - {id: T02, title: Scripts for audiovisual pieces, phase: Pieces, depends_on: [T01]}
      - {id: T03, title: Tone and brand review, depends_on: [T01, T02], done_when: "Copy approved"}
  - code: PRO
    title: Production
    phases: [Preparation, Execution]
    tasks:
      - {id: T01, title: Production budget and schedule, phase: Preparation, depends_on: ["stage:CON"]}
      - {id: T02, title: Production of pieces, phase: Execution, depends_on: [T01]}
      - {id: T03, title: Landing page, phase: Execution, depends_on: [T01]}
      - {id: T04, title: Quality control, depends_on: [T02, T03], done_when: "Checklist complete"}
  - code: PUB
    title: Publishing
    phases: [Preparation, Launch]
    tasks:
      - {id: T01, title: Publishing plan, phase: Preparation, depends_on: ["stage:PRO"]}
      - {id: T02, title: Scheduling of posts, phase: Preparation, depends_on: [T01]}
      - {id: T03, title: Campaign launch, phase: Launch, depends_on: [T02], done_when: "Pieces published according to the plan"}
  # No recurrence: another round of measurement is created as a new project.
  - code: MED
    title: Measurement
    phases: [Tracking, Report]
    tasks:
      - {id: T01, title: Indicator tracking, phase: Tracking, depends_on: ["stage:PUB"]}
      - {id: T02, title: Results report, phase: Report, depends_on: [T01]}
      - {id: T03, title: Lessons learned, phase: Report, depends_on: [T02]}
