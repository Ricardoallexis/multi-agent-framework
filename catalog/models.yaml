routing_profiles:
  profiles:
    local_non_sensitive_supervised:
      version: 1
      enabled: false
      candidate_model_ids: [local_default]
      max_candidates: 1
      required_capabilities: [structured_output]
      required_roles: []
      required_permissions: []
      allowed_permissions: []
      allowed_data_classes: [non_sensitive]
      execution_modes: [auto, local]
      require_health: false
      economic_selection: false
      max_retries_per_candidate: 0
      max_provider_invocations: 1
    # Economic profile (ECO-T05): disabled and assigned to no workflow step. Orchestration, planning and
    # review take the cheapest classified model of level T3 or higher; work takes the cheapest classified
    # model of level T2 or lower. Only models with level, classification: classified and current price
    # evidence take part; nothing falls back to the legacy binding. To use it, see docs/model-routing.md.
    # The permission ceiling below is empty (local models only); add provider:cloud to allow cloud models.
    economic:
      version: 1
      enabled: false
      mode: supervised            # supervised | automatic | single (single also needs model_id)
      levels:
        orchestration: {min: T3}
        planning: {min: T3}
        review: {min: T3}
        work: {max: T2}
      effort: {work: low, review: medium}   # fills a step's effort only when the step sets none
      economic_selection: true
      escalation: {max_escalations_per_step: 1, ceiling: T3}   # one step failure on output quality may move up one level (docs/model-routing.md)
      required_capabilities: [structured_output]
      required_roles: []
      required_permissions: []
      allowed_permissions: []
      allowed_data_classes: [non_sensitive]
      execution_modes: [auto, local, cloud]
      require_health: false
      max_retries_per_candidate: 1
  assignments: {}
# Context compaction (CMP-T02, contract CMP-T01 section 11). Declared apart from routing_profiles so it can be
# switched on without changing how models are chosen. Off until a profile is `enabled: true` AND assigned:
# with none assigned, prompts and events are exactly what they were. Before every model call the framework
# estimates the prompt against the model's context window (`context_window` above):
#   - at `warning_at` (62 % of the window) it records a `context_warning` event;
#   - at `threshold` (70 %) it records one with `compaction_pending: true`; the call still goes ahead,
#     and the compaction happens when the step finishes (never in the middle of it).
#   - a model with no known window is never guessed: `unknown_window: skip` lets the call go ahead with one
#     warning per run and model; `block` stops it instead.
# `keep_recent` is how many of the latest outputs are never summarized; `summary` is how summaries are made
# (levels T1/T2 only) and `tasks.window_tokens` the window to measure task context against (null = the
# requested model's). `assignments` maps a workflow id, or `tasks` for task envelopes, to a profile:
#   assignments: {social_post: standard, tasks: standard}
context_profiles:
  profiles:
    standard:
      version: 1
      enabled: false
      warning_at: 0.62
      threshold: 0.70
      unknown_window: skip        # skip | block
      keep_recent: 1
      summary: {first_level: T1, retry_level: T2, effort: low, model_check: true, max_calls: 4, max_ratio: 0.5}
      tasks: {window_tokens: null}
  assignments: {}
