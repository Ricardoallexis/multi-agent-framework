      structured_output: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: claude_cli, observed_at: "2026-10-10", values: ["--output-format json"]}
      session_store: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: claude_cli, observed_at: "2026-10-10", values: ["~/.claude/projects/**/<id>.jsonl"]}
      resume: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: claude_cli, observed_at: "2026-10-10", values: ["--resume <id>"]}
