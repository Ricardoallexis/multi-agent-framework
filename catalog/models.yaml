routing_profiles:
  profiles:
    local_non_sensitive_supervised:
      version: 1
      enabled: false
      candidate_model_ids: [local_default]
      max_candidates: 1
      required_capabilities: [structured_output]
      required_roles: []
      required_permissions: []
      allowed_permissions: []
      allowed_data_classes: [non_sensitive]
      execution_modes: [auto, local]
      require_health: false
      economic_selection: false
      max_retries_per_candidate: 0
      max_provider_invocations: 1
    # Economic profile (ECO-T05): disabled and assigned to no workflow step. Orchestration, planning and
    # review take the cheapest classified model of level T3 or higher; work takes the cheapest classified
    # model of level T2 or lower. Only models with level, classification: classified and current price
    # evidence take part; nothing falls back to the legacy binding. To use it, see docs/model-routing.md.
    # The permission ceiling below is empty (local models only); add provider:cloud to allow cloud models.
    economic:
      version: 1
      enabled: false
      mode: supervised            # supervised | automatic | single (single also needs model_id)
      levels:
        orchestration: {min: T3}
        planning: {min: T3}
        review: {min: T3}
        work: {max: T2}
      effort: {work: low, review: medium}   # fills a step's effort only when the step sets none
      economic_selection: true
      escalation: {max_escalations_per_step: 1, ceiling: T3}   # one step failure on output quality may move up one level (docs/model-routing.md)
      required_capabilities: [structured_output]
      required_roles: []
      required_permissions: []
      allowed_permissions: []
      allowed_data_classes: [non_sensitive]
      execution_modes: [auto, local, cloud]
      require_health: false
      max_retries_per_candidate: 1
  assignments: {}
# T15 executor declarations are intentionally manual until a conforming adapter
# provides fixed, verifiable capability evidence. These are surface presets,
# not claims that a particular client is present or available.
executor_routing:
  version: 1
  profiles: {}
  executors:
    codex_app_subagents:
      surface: codex_app_subagents
      version: "1"
      mode: manual
      adapter_id: null
      capabilities_available: null
      roles_available: null
      permissions_available: null
      permissions_required: null
      permissions_consumed: null
      permission_ceiling: null
      allowed_data_classes: null
      execution_modes: null
    claude_code:
      surface: claude_code
      version: "1"
      mode: manual
      adapter_id: null
      capabilities_available: null
      roles_available: null
      permissions_available: null
      permissions_required: null
      permissions_consumed: null
      permission_ceiling: null
      allowed_data_classes: null
      execution_modes: null
    # ORQ-T46 executor applications (CLI-driven agent apps, contract ORQ-6 section 2). Declared DISABLED: they are
    # never selected or launched until the operator enables them (ORQ-T51 wires their adapters, T48..T50, by adapter_id).
    # Optional keys read by the executor service (ORQ-T51), all trusted configuration: workdir (an existing absolute
    # folder the framework owns), timeout_seconds and quota_pause_minutes. A top-level task_workdirs map (task id ->
    # folder) sets the folder of one task. Without them the framework creates <local_dir>/executor_runs/task-<id>.
    # Evidence comes from the P-384 manual tests (operator_test, 2026-10-10).
    # model_support/effort_support list only the values observed in those tests (extend after probing);
    # Claude model/effort stay unknown (no model ID or effort value was recorded). quota_signal and terms
    # were not probed and stay unknown. blocks_when_open: "supported" = the app blocks writes while open.
    codex_cli:
      surface: codex_cli
      version: "1"
      mode: manual
      enabled: false
      adapter_id: codex_cli
      capabilities_available: null
      roles_available: null
      permissions_available: null
      permissions_required: null
      permissions_consumed: null
      permission_ceiling: null
      allowed_data_classes: null
      execution_modes: null
      model_support: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["gpt-6.1-sol"]}
      effort_support: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["ultra"]}
      noninteractive_launch: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["codex exec --json"]}
      structured_output: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["--json"]}
      session_store: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["~/.codex/sessions/**/rollout-*.jsonl"]}
      resume: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["codex exec resume <id>"]}
      blocks_when_open: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["active writer"]}
      open_in_app: {status: supported, source: "P-384 #385/#387/#389/#390", provenance: operator_test, scope: codex_cli, observed_at: "2026-10-10", values: ["target:codex://threads/<id>", "live:continue_in_app"]}
      quota_signal: {status: unknown}
      terms: {status: unknown}
    claude_cli:
