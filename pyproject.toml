[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-framework"
dynamic = ["version"]
description = "Hybrid human/AI multi-agent orchestration framework with local and cloud model adapters"
authors = [{ name = "Ricardo A." }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["multi-agent", "ai-agents", "orchestration", "llm", "ollama", "human-in-the-loop", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
gemini = ["google-genai==2.13.0"]
openai = ["openai==2.46.0"]

[project.scripts]
multiagent = "multiagent.cli:main"

[tool.setuptools]
packages = [
  "multiagent",
  "multiagent.adapters",
  "multiagent.db",
  "multiagent._resources",
  "multiagent._resources.catalog",
  "multiagent._resources.workflows",
  "multiagent._resources.prompts",
  "multiagent._resources.skills",
  "multiagent._resources.migrations",
]

[tool.setuptools.package-dir]
"multiagent._resources.catalog" = "catalog"
"multiagent._resources.workflows" = "workflows"
"multiagent._resources.prompts" = "prompts"
"multiagent._resources.skills" = "skills"
"multiagent._resources.migrations" = "migrations"

[tool.setuptools.package-data]
"multiagent._resources.catalog" = ["*.yaml"]
"multiagent._resources.workflows" = ["*.yaml"]
"multiagent._resources.prompts" = ["*/*.md"]
"multiagent._resources.skills" = ["*.md", "*/*.md"]
"multiagent._resources.migrations" = ["*.sql"]

[tool.setuptools.dynamic]
version = {attr = "multiagent.version.__package_version__"}

[project.urls]
Homepage = "https://github.com/Ricardoallexis/multi-agent-framework"
Repository = "https://github.com/Ricardoallexis/multi-agent-framework"
Issues = "https://github.com/Ricardoallexis/multi-agent-framework/issues"
Documentation = "https://github.com/Ricardoallexis/multi-agent-framework/tree/main/docs"
Changelog = "https://github.com/Ricardoallexis/multi-agent-framework/blob/main/CHANGELOG.md"
