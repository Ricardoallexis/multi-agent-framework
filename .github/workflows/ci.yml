name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      # Current version declarations must match multiagent/version.py (and the tag on tag builds).
      - run: python scripts/check_version_consistency.py
      - run: python scripts/update_progress.py --check
      - run: python -m pytest -q
      - run: python examples/python_quickstart.py
      - run: multiagent --version
      - name: Verify the standalone wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build
          demo_dir="$(mktemp -d)"
          python -m venv "$demo_dir/venv"
          "$demo_dir/venv/bin/python" -m pip install dist/*.whl
          cd "$demo_dir"
          "$demo_dir/venv/bin/python" -m pip check
          PYTHONPATH= "$demo_dir/venv/bin/python" -c 'import multiagent, sys; from pathlib import Path; from multiagent.config import Settings; assert Path(multiagent.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); assert (Settings(_env_file=None).catalog_dir / "agents.yaml").is_file()'
          PYTHONPATH= "$demo_dir/venv/bin/python" "$GITHUB_WORKSPACE/examples/python_quickstart.py"
          # Every package and the Stage 0 UI assets must ship in the wheel.
          PYTHONPATH= "$demo_dir/venv/bin/python" -c 'import multiagent.api, multiagent.services, multiagent.ui as ui; assert (ui.STATIC_DIR / "index.html").is_file(); assert (ui.STATIC_DIR / "js" / "api.js").is_file()'
